[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clb-system-backend"
version = "0.1.0"
description = "Hệ thống Quản lý Câu Lạc Bộ Sinh Viên - Giai đoạn 1"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CLB Engineering Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "greenlet>=3.0.3",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "google-genai>=2.0.0",
    "pgvector>=0.3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "aiosqlite>=0.20.0",
]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "aiosqlite>=0.20.0",
    "black>=24.3.0",
    "ruff>=0.3.4",
]
