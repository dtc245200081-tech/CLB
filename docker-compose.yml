services:
  # ============================================================
  # 1. Cơ sở dữ liệu: PostgreSQL 16 tích hợp pgvector
  # ============================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: clb_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-clb_system_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clb_system_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # 2. Backend: FastAPI + SQLAlchemy 2.0 (User không phải root)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: clb_backend_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_123}@db:5432/${POSTGRES_DB:-clb_system_db}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_123}@db:5432/${POSTGRES_DB:-clb_system_db}
    volumes:
      - ./backend/app:/app/app
      - ./knowledge:/app/knowledge:ro
      - attendance_photos:/app/storage/attendance_photos
      - receipt_photos:/app/storage/receipt_photos
      - avatar_photos:/app/storage/avatar_photos
    ports:
      - "${HOST_PORT_API:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # ============================================================
  # 3. Frontend: React + Vite + TypeScript (Build Nginx static)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: clb_frontend_ui
    restart: unless-stopped
    ports:
      - "${HOST_PORT_FRONTEND:-3000}:80"
    depends_on:
      - backend

  # ============================================================
  # 4. Reverse Proxy Nginx: Cổng vào duy nhất của hệ thống
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: clb_nginx_gateway
    restart: unless-stopped
    ports:
      - "${HOST_PORT_HTTP:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  attendance_photos:
  receipt_photos:
  avatar_photos:
